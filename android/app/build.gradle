plugins {
    id 'com.android.application'
}

android {
    namespace 'de.alditalk.extender'
    compileSdk 36

    defaultConfig {
        applicationId 'de.alditalk.extender'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // No external dependencies: everything here is plain Android framework.
}
